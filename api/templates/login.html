<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión — La Hornilla</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anybody:wght@600;700;800&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/static/style.css">
  <style>
    .google-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 12px 16px;
      background: #ffffff;
      color: #1f1f1f;
      border: 1px solid #dadce0;
      border-radius: 8px;
      font-family: 'Archivo', system-ui, sans-serif;
      font-size: 0.9375rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
      box-shadow: 0 1px 2px rgba(0,0,0,0.06);
    }
    .google-btn:hover {
      background: #f8faff;
      border-color: #c6d2e5;
      box-shadow: 0 2px 6px rgba(60,64,67,0.15);
    }
    .google-btn svg { flex-shrink: 0; }
    .login-hint {
      margin-top: var(--sp-3, 16px);
      font-size: 0.8125rem;
      color: var(--text-muted, #6b7280);
      text-align: center;
      line-height: 1.5;
    }
  </style>
</head>
<body class="login-body">
  <main class="login-shell">
    <section class="login-card {% if error %}login-card-shake{% endif %}">
      <div class="login-brand">
        <div class="login-brand-icon">
          <img src="/static/logolh.png" alt="La Hornilla">
        </div>
        <div class="login-brand-text">
          <span class="login-brand-name">La Hornilla</span>
          <span class="login-brand-sub">Fertilizaciones</span>
        </div>
      </div>

      <h1 class="login-title">Iniciar sesión</h1>
      <p class="login-sub">Accede con tu cuenta corporativa @lahornilla.cl</p>

      {% if error %}
      <div class="login-error">{{ error }}</div>
      {% endif %}

      <a href="/login/google?next={{ next | urlencode }}" class="google-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.99.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Iniciar sesión con Google
      </a>

      <p class="login-hint">
        Solo se permiten cuentas del dominio <strong>@lahornilla.cl</strong>.<br>
        Si tu correo no aparece registrado, contacta a TI.
      </p>
    </section>
  </main>
</body>
</html>
